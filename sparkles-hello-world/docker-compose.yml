version: "3.7"

services:
  server:
    image: justinhimself/p910nd:latest
    container_name: bun1a-p910nd_server_1
    restart: unless-stopped

    command:
      - "-b"
      - "-d"
      - "-f"
      - "/dev/usb/lp0"

    devices:
      - /dev/usb/lp0:/dev/usb/lp0:rwm

    ports:
      - "9100:9100"
