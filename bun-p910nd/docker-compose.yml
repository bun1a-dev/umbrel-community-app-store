version: "3.7"

services:
  server:
    image: justinhimself/p910nd:latest
    container_name: bun-p910nd_server_1
    restart: unless-stopped
    command:
      - "-b"
      - "-d"
      - "-f"
      - "/dev/usb/lp0"
    devices:
      - "/dev/usb/lp0:/dev/usb/lp0:rwm"
    ports:
      - "9100:9100"

  web:
    image: nginx:alpine
    container_name: bun-p910nd_web_1
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    expose:
      - "8080"
    command: ["/bin/sh", "-c", "sed -i 's/listen       80;/listen       8080;/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]

  app_proxy:
    image: getumbrel/app-proxy:1.0.0
    container_name: bun-p910nd_app_proxy_1
    restart: unless-stopped
    environment:
      APP_HOST: bun-p910nd_web_1
      APP_PORT: 8080
