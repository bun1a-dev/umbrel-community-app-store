version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bun-p910nd_web_1
      APP_PORT: 80

  web:
    image: nginx:alpine
    restart: on-failure

  server:
    image: justinhimself/p910nd:latest
    restart: unless-stopped
    command:
      - "-b"
      - "-d"
      - "-f"
      - "/dev/usb/lp0"
    devices:
      - "/dev/usb/lp0:/dev/usb/lp0:rwm"
    ports:
      - "9100:9100"
